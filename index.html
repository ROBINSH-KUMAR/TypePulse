<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TypePulse</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
   <style>
*{box-sizing:border-box;transition:background .3s,color .3s}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Poppins,sans-serif;background:#f3f4f6;color:#111;overflow:hidden
}
body.dark{background:#1e1e2f;color:#e4e4e4}

.shape{position:fixed;border-radius:30px;z-index:-1}
.yellow{width:220px;height:220px;background:#ffd54a;bottom:-60px;left:-30px;transform:rotate(15deg)}
.red{width:300px;height:300px;background:#ef6b6b;top:-80px;right:-40px;transform:rotate(-20deg)}
.cyan{width:150px;height:150px;background:#00c7b7;bottom:20px;right:60px;transform:rotate(25deg);opacity:.12}

.app{
  width:900px;max-width:95%;padding:30px;margin-top:-80px;
  background:#ffffffd9;backdrop-filter:blur(20px);
  border-radius:20px;box-shadow:0 20px 50px #0002
}
body.dark .app{background:#020617d9}

textarea{
  width:100%;height:250px;padding:14px;border:0;border-radius:12px;
  resize:none;font:15px Poppins;background:#0000000d
}
textarea::-webkit-scrollbar,#paraSuggestions::-webkit-scrollbar{display:none}
textarea,#paraSuggestions{scrollbar-width:none}
body.dark textarea{background:#ffffff14;color:#fff}

.btn,.dialog-btn.primary{
  padding:14px 26px;border:0;border-radius:30px;
  font-weight:600;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#00c7b7,#007a74)
}

.time-options{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;margin-bottom:20px
}
.time-card{
  padding:16px;border-radius:16px;text-align:center;cursor:pointer;
  background:#0000000d;font-weight:600
}
body.dark .time-card{background:#ffffff14}
.time-card.active{background:#00c7b726;box-shadow:inset 0 0 0 2px #00c7b7}

.typing-area{display:none;min-height:360px}
.control-bar{display:flex;justify-content:space-between;align-items:center}
.timer{font-size:20px;font-weight:600;color:#00c7b7}

.text{margin-top:20px;font-size:18px;line-height:2.2;min-height:220px}
.row{margin-bottom:18px}
.reference{opacity:.35;font-size:20px;line-height:1.8}
.row.active .reference{opacity:1}
.reference span.correct{color:#00c7b7}
.reference span.wrong{color:#ef4444}
.input{
  min-height:28px;font-size:20px;line-height:1.8;
  border-bottom:2px solid #0003
}
body.dark .input{border-color:#fff4}
.input span{color:#111}
.input span.correct{color:#00c7b7}
.input span.wrong{color:#ef4444;text-decoration:underline}
body.dark .input span{color:#fff}
body.dark .input span.correct{color:#00c7b7}
body.dark .input span.wrong{color:#ef4444}

.caret{
  display:inline-block;width:2px;height:1.2em;background:#00c7b7;
  animation:blink 1s infinite;vertical-align:bottom
}
@keyframes blink{50%{opacity:0}}

#hiddenInput{position:absolute;opacity:0;pointer-events:none}

.reset-btn{
  padding:12px 22px;border:0;border-radius:30px;cursor:pointer;
  font-weight:600;color:#fff;
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow:0 10px 25px #ef444466
}
.reset-btn:hover{transform:translateY(-2px)}
body.dark .reset-btn{
  background:linear-gradient(135deg,#1f2933,#111827);
  color:#f87171;box-shadow:inset 0 0 0 1px #f8717166,0 10px 25px #0009
}
body.dark .reset-btn:hover{
  background:linear-gradient(135deg,#7f1d1d,#450a0a);color:#fff
}

.result{display:none;margin-top:30px}
.result-box{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:25px;padding:25px;margin-bottom:30px;
  border-radius:20px;background:#0000000d
}
body.dark .result-box{background:#ffffff14}

.result-card{
  padding:25px;border-radius:18px;text-align:center;
  background:#ffffffe6;box-shadow:0 12px 30px #0000001a
}
body.dark .result-card{background:#020617e6}
.result-card h3{margin:0;font-size:14px;opacity:.7}
.result-card p{margin:10px 0 0;font-size:32px;font-weight:600;color:#00c7b7}

.chart-wrapper{display:flex;align-items:flex-end;gap:12px}
.y-axis{
  height:180px;display:flex;flex-direction:column;
  justify-content:space-between;font-size:12px;font-weight:600;opacity:.7
}
.chart{
  flex:1;height:181px;display:flex;align-items:flex-end;gap:20px;
  padding:20px;border-radius:18px;background:#0000000a;overflow:hidden
}
body.dark .chart{background:#ffffff0f}
.bar{
  width:42px;min-width:20px;
  background:linear-gradient(135deg,#00c7b7,#007a74);
  border-radius:10px 10px 0 0;position:relative
}
.bar span{
  position:absolute;top:-24px;width:100%;text-align:center;
  font-size:13px;font-weight:600
}

.dark-toggle{
  position:fixed;right:25px;bottom:25px;width:55px;height:55px;
  border:0;border-radius:50%;background:#00c7b7;color:#fff;
  font-size:22px;cursor:pointer
}

#paraSuggestions{
  display:none;margin-top:10px;padding:6px;max-height:160px;
  overflow-y:auto;border-radius:12px;background:#0000000d
}
body.dark #paraSuggestions{background:#ffffff14}

.suggestion-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;opacity:.85
}
.suggestion-item:hover{background:#00c7b726;opacity:1}
.suggestion-delete{color:#ef4444;padding:4px 8px;border-radius:6px}
.suggestion-delete:hover{background:#ef444426}

.ui-message{
  position:fixed;top:25px;left:50%;width:min(420px,calc(100% - 30px));
  display:flex;align-items:center;gap:14px;padding:15px 18px;
  border-radius:16px;background:#fffffff2;backdrop-filter:blur(20px);
  box-shadow:0 15px 40px #0000002e;z-index:9999;
  opacity:0;pointer-events:none;transform:translate(-50%,-120px);
  transition:transform .35s,opacity .35s
}
.ui-message.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
body.dark .ui-message{background:#0f172af5;color:#fff}

.ui-message-icon{
  width:40px;height:40px;min-width:40px;display:flex;
  align-items:center;justify-content:center;border-radius:12px;
  background:#ef44441f;color:#ef4444;font-size:18px
}
.ui-message-content{display:flex;flex-direction:column;gap:2px;flex:1}
.ui-message-content strong{font-size:14px}
.ui-message-content span{font-size:13px;opacity:.7}
.ui-message-close{
  width:32px;height:32px;border:0;border-radius:8px;
  background:transparent;color:inherit;cursor:pointer;font-size:16px
}

.dialog-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0006;backdrop-filter:blur(6px);z-index:9998;
  opacity:0;visibility:hidden;transition:.25s
}
.dialog-overlay.show{opacity:1;visibility:visible}
.dialog-box{
  width:min(420px,calc(100% - 30px));padding:30px;border-radius:22px;
  background:#fffffff5;text-align:center;
  box-shadow:0 25px 70px #00000040;
  transform:scale(.9) translateY(20px);transition:.3s
}
.dialog-overlay.show .dialog-box{transform:scale(1) translateY(0)}
body.dark .dialog-box{background:#0f172af7;color:#fff}

.dialog-icon{
  width:60px;height:60px;margin:0 auto 15px;
  display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:#00c7b71f;color:#00c7b7;font-size:25px
}
.dialog-box h3{margin:0 0 8px;font-size:20px}
.dialog-box p{margin:0 auto 25px;font-size:14px;opacity:.65;line-height:1.6}
.dialog-actions{display:flex;gap:12px}
.dialog-btn{
  flex:1;padding:12px 16px;border:0;border-radius:12px;
  font:600 14px Poppins;cursor:pointer
}
.dialog-btn.secondary{background:#0000000f;color:inherit}
body.dark .dialog-btn.secondary{background:#ffffff14}

@media(max-width:500px){
  .dialog-actions{flex-direction:column}
}

</style>
</head>

<body>

<div class="shape yellow"></div>
<div class="shape red"></div>
<div class="shape cyan"></div>

<div class="app">

  <div class="setup">
    <h2><i class="fa-solid fa-keyboard"></i> Typing Test Setup</h2>

    <div class="time-options">
      <div class="time-card" data-time="60">1 Min</div>
      <div class="time-card" data-time="300">5 Min</div>
      <div class="time-card active" data-time="600">10 Min</div>
      <div class="time-card" data-time="1200">20 Min</div>
      <div class="time-card" data-time="1800">30 Min</div>
      <div class="time-card" data-time="3600">60 Min</div>
    </div>

    <textarea id="paraInput" placeholder="Paste paragraph here..."></textarea>
    <div id="paraSuggestions"></div>
    <button class="btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="typing-area">
    <div class="control-bar">
      <div class="timer">⏱ <span id="time">10:00</span></div>
      <div>
        <button class="reset-btn" onclick="resetTest()">Reset</button>
        <button class="reset-btn" onclick="finishTest()">✖ Close</button>
      </div>
    </div>

    <div class="text" id="text"></div>
    <input id="hiddenInput" autocomplete="off">
  </div>

  <div class="result" id="result"></div>
</div>

<button class="dark-toggle" id="darkToggle">
  <i class="fas fa-sun"></i>
</button>

<div id="uiMessage" class="ui-message">
  <div class="ui-message-icon" id="uiMessageIcon">
    <i class="fa-solid fa-circle-exclamation"></i>
  </div>
  <div class="ui-message-content">
    <strong id="uiMessageTitle">Notice</strong>
    <span id="uiMessageText"></span>
  </div>
  <button class="ui-message-close" onclick="hideMessage()">
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>

<div id="shuffleDialog" class="dialog-overlay">
  <div class="dialog-box">
    <div class="dialog-icon"><i class="fa-solid fa-shuffle"></i></div>
    <h3>Shuffle Sentences?</h3>
    <p>Do you want to shuffle the sentences before starting the typing test?</p>

    <div class="dialog-actions">
      <button class="dialog-btn secondary" onclick="chooseShuffle(false)">
        No, Keep Order
      </button>
      <button class="dialog-btn primary" onclick="chooseShuffle(true)">
        <i class="fa-solid fa-shuffle"></i> Yes, Shuffle
      </button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

const body=document.body,
      setup=$(".setup"),
      typingArea=$(".typing-area"),
      hiddenInput=$("#hiddenInput"),
      text=$("#text"),
      result=$("#result"),
      time=$("#time"),
      paraInput=$("#paraInput"),
      suggestionBox=$("#paraSuggestions"),
      toggle=$("#darkToggle"),
      icon=toggle.querySelector("i"),
      message=$("#uiMessage"),
      messageTitle=$("#uiMessageTitle"),
      messageText=$("#uiMessageText"),
      messageIcon=$("#uiMessageIcon"),
      shuffleDialog=$("#shuffleDialog");

const STORAGE_KEY="typing_paragraph_history";

let selectedTime=600,
    timeLeft=600,
    timer,
    timerStarted=false,
    sentences=[],
    currentLine=0,
    typedLines=[],
    totalCharsTyped=0,
    correctCharsTyped=0,
    shuffleChoice;

/* ---------- Message ---------- */

let messageTimer;

function showMessage(msg,title="Notice",type="error"){
  clearTimeout(messageTimer);
  messageTitle.textContent=title;
  messageText.textContent=msg;

  const success=type==="success";
  messageIcon.innerHTML=`<i class="fa-solid fa-circle-${success?"check":"exclamation"}"></i>`;
  messageIcon.style.color=success?"#00a896":"#ef4444";
  messageIcon.style.background=success?"#00c7b71f":"#ef44441f";

  message.classList.add("show");
  messageTimer=setTimeout(hideMessage,3500);
}

function hideMessage(){
  message.classList.remove("show");
}

/* ---------- Shuffle Dialog ---------- */

function showShuffleDialog(){
  shuffleDialog.classList.add("show");
  return new Promise(resolve=>shuffleChoice=resolve);
}

function chooseShuffle(value){
  shuffleDialog.classList.remove("show");
  shuffleChoice?.(value);
  shuffleChoice=null;
}

/* ---------- Paragraph History ---------- */

function getStoredParas(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
}

function saveParagraph(value){
  let paras=getStoredParas().filter(p=>p!==value);
  paras.unshift(value);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(paras.slice(0,5)));
}

function deleteParagraph(value){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(getStoredParas().filter(p=>p!==value))
  );
  showSuggestions();
}

function showSuggestions(){
  const paras=getStoredParas();
  suggestionBox.innerHTML="";

  if(!paras.length){
    suggestionBox.style.display="none";
    return;
  }

  paras.forEach(p=>{
    const item=document.createElement("div");
    item.className="suggestion-item";

    const span=document.createElement("span");
    span.textContent=p.slice(0,120)+(p.length>120?"...":"");
    span.onclick=()=>{
      paraInput.value=p;
      suggestionBox.style.display="none";
    };

    const del=document.createElement("span");
    del.className="suggestion-delete";
    del.innerHTML='<i class="fa-solid fa-trash"></i>';
    del.onclick=e=>{
      e.stopPropagation();
      deleteParagraph(p);
    };

    item.append(span,del);
    suggestionBox.appendChild(item);
  });

  suggestionBox.style.display="block";
}

paraInput.addEventListener("focus",showSuggestions);
paraInput.addEventListener("input",()=>{
  paraInput.value.trim()
    ? suggestionBox.style.display="none"
    : showSuggestions();
});

/* ---------- Theme ---------- */

function setTheme(theme){
  body.classList.toggle("dark",theme==="dark");
  icon.className=theme==="dark"?"fas fa-sun":"fas fa-moon";
  localStorage.setItem("theme",theme);
}

setTheme(localStorage.getItem("theme")||"dark");

toggle.onclick=()=>{
  setTheme(body.classList.contains("dark")?"light":"dark");
};

/* ---------- Time ---------- */

$$(".time-card").forEach(card=>{
  card.onclick=()=>{
    $$(".time-card").forEach(c=>c.classList.remove("active"));
    card.classList.add("active");
    selectedTime=+card.dataset.time;
  };
});

function formatTime(sec){
  return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

/* ---------- Shuffle ---------- */

function shuffleArray(arr){
  arr=[...arr];

  for(let i=arr.length-1;i;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}

/* ---------- Start ---------- */

async function startTest(){

  const value=paraInput.value.trim();

  if(!selectedTime)
    return showMessage("Please select a typing test duration first.","Time Required");

  if(!value)
    return showMessage("Please enter or paste some text before starting.","Text Required");

  saveParagraph(value);

  clearInterval(timer);
  timerStarted=false;
  timeLeft=selectedTime;
  time.textContent=formatTime(timeLeft);

  const raw=value.split(/\n+|(?<=[.!?])\s+/);
  sentences=(await showShuffleDialog())?shuffleArray(raw):raw;

  currentLine=0;
  typedLines=[];
  totalCharsTyped=0;
  correctCharsTyped=0;

  renderLines();

  setup.style.display="none";
  typingArea.style.display="block";
  result.style.display="none";
  body.style.userSelect="none";

  hiddenInput.value="";
  hiddenInput.focus();
}

/* ---------- Render ---------- */

function renderLines(){
  text.innerHTML="";
  hiddenInput.value="";

  sentences.slice(currentLine,currentLine+5).forEach((sentence,i)=>{
    const row=document.createElement("div");
    row.className=`row${i===0?" active":""}`;

    const ref=document.createElement("div");
    ref.className="reference";
    ref.innerHTML=[...sentence]
      .map(ch=>`<span>${ch}</span>`)
      .join("");

    const input=document.createElement("div");
    input.className="input";

    row.append(ref,input);
    text.appendChild(row);
  });
}

/* ---------- Typing ---------- */

hiddenInput.addEventListener("input",()=>{

  if(!timerStarted){
    timerStarted=true;

    timer=setInterval(()=>{
      timeLeft--;
      time.textContent=formatTime(timeLeft);

      if(timeLeft<=0) finishTest();
    },1000);
  }

  const row=$(".row.active");
  if(!row)return;

  const reference=row.querySelector(".reference");
  const input=row.querySelector(".input");
  const typed=hiddenInput.value;

  /* Reference character feedback */
  reference.querySelectorAll("span").forEach((span,i)=>{
    span.classList.remove("correct","wrong");

    if(i<typed.length)
      span.classList.add(
        typed[i]===span.textContent?"correct":"wrong"
      );
  });

  typedLines[currentLine]=typed;

  /* Calculate overall accuracy */
  totalCharsTyped=0;
  correctCharsTyped=0;

  sentences.forEach((sentence,i)=>{
    const value=typedLines[i]||"";
    const limit=Math.min(sentence.length,value.length);

    for(let j=0;j<limit;j++){
      totalCharsTyped++;
      if(value[j]===sentence[j]) correctCharsTyped++;
    }

    if(value.length>sentence.length)
      totalCharsTyped+=value.length-sentence.length;
  });

  /* Typed text feedback */
  input.innerHTML="";

  typed.split(" ").forEach((word,i)=>{
    if(!word && i===typed.split(" ").length-1)return;

    const refWord=reference.textContent.split(" ")[i]||"";
    const span=document.createElement("span");

    const correct=
      word===refWord ||
      (word.length<=refWord.length &&
       [...word].every((c,j)=>c===refWord[j]));

    span.className=correct?"correct":"wrong";
    span.textContent=word+" ";
    input.appendChild(span);
  });

  const caret=document.createElement("span");
  caret.className="caret";
  input.appendChild(caret);

  /* Next sentence */
  if(typed.length>=reference.textContent.length){
    currentLine++;
    renderLines();
  }
});

/* ---------- Focus / Anti Cheat ---------- */

document.addEventListener("click",()=>{
  if(typingArea.style.display==="block") hiddenInput.focus();
});

["paste","copy","cut","drop","contextmenu"].forEach(evt=>{
  hiddenInput.addEventListener(evt,e=>e.preventDefault());
});

/* ---------- Result ---------- */

function finishTest(){

  clearInterval(timer);
  timerStarted=false;
  typingArea.style.display="none";
  body.style.userSelect="auto";

  const elapsed=selectedTime-timeLeft;
  const minutes=elapsed/60;

  const wpm=minutes>0
    ?Math.round(correctCharsTyped/5/minutes)
    :0;

  const accuracy=totalCharsTyped
    ?Math.round(correctCharsTyped/totalCharsTyped*100)
    :0;

  let history=JSON.parse(localStorage.getItem("wpmHistory")||"[]");
  history=[...history,wpm].slice(-10);
  localStorage.setItem("wpmHistory",JSON.stringify(history));

  const bars=history.map(v=>`
    <div class="bar" style="height:${Math.min(v/75*180,180)}px">
      <span>${v}</span>
    </div>
  `).join("");

  result.style.display="block";

  result.innerHTML=`
    <div class="result-box">
      <div class="result-card">
        <h3>Words Per Minute</h3>
        <p>${wpm}</p>
      </div>
      <div class="result-card">
        <h3>Accuracy</h3>
        <p>${accuracy}%</p>
      </div>
    </div>

    <h3 style="text-align:center;margin-bottom:10px">Previous Speeds</h3>

    <div class="chart-wrapper">
      <div class="y-axis">
        <span>75</span><span>65</span><span>45</span><span>25</span>
      </div>
      <div class="chart">${bars}</div>
    </div>

    <div style="text-align:center;margin-top:30px">
      <button class="reset-btn" onclick="resetTest()">↻ Restart Test</button>
    </div>
  `;
}

/* ---------- Reset ---------- */

function resetTest(){
  clearInterval(timer);
  timerStarted=false;
  body.style.userSelect="auto";
  hiddenInput.value="";

  typingArea.style.display="none";
  result.style.display="none";
  setup.style.display="block";

  timeLeft=selectedTime;
  time.textContent=formatTime(selectedTime);
}
</script>

</body>
</html>
